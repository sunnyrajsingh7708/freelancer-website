  <script>
  //.Arithmetic operators
    let x = 60;
    let y = 90;
    console.log(x+y,x-y,x*y,x/y,x%y,x++,++x,x--,--x);
    //increment and decrement operators
    var a = 10;
    y = a++;
    console.log(a);
    console.log(y);
    var b = 10;
    y = --b;
    console.log(b);
    console.log(y);
    var c = 10;
    y = c--;
    console.log(c);
    console.log(y);
    //Assignment operators
    let q=10;
    let r=20;
    console.log(q+=r,q-=r,q*=r,q/=r,q%=r);

    let w = 10;
    let s = 10;
    console.log(w==s,w===s,w!=s,w!==s,w>s,w<s,w>=s,w<=s);

    //Logical Operator
    let q1=3;
    let q2=5;
    console.log((q1 > q2) && (q1 == q2));

    //Branching operator
    let marks = 90;
    if (marks >=90){
        console.log("Elite batch");
    }
    else if (marks>=75) {
        console.log("intermediate batch");
    }
    else if (marks >= 60){
        console.log("Regular batch");
  }
    else {
       console.log("Fail");
}

console.log(i);}

console.log(j);j++;
