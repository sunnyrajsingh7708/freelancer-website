<!DOCTYPE html>
<html>
<head>
    <title>Marks Table</title>

    <style>
        table {
            width: 80%;
            margin: 30px auto;
            border-collapse: collapse;
            text-align: center;
            font-family: Arial, sans-serif;
        }

        th, td {
            border: 2px solid #555;
            padding: 20px;
        }

        th {
            font-size: 20px;
            background-color: #f2f2f2;
        }

        td {
            font-size: 18px;
        }

        .name {
            width: 25%;
        }

        .subject {
            width: 20%;
        }

        .marks {
            width: 15%;
        }

        .total {
            width: 25%;
            font-size: 20px;
        }
    </style>
</head>

<body>

<table>

    <!-- Header Row -->
    <tr>
        <th class="name">Name</th>

        <!-- Marks contains two columns -->
        <th colspan="2">Marks</th>

        <th class="total">Total Marks</th>
    </tr>

    <!-- Rehman -->
    <tr>
        <td rowspan="2">Rehman</td>

        <td>Sub1</td>
        <td>95</td>

        <td rowspan="2">195</td>
    </tr>

    <tr>
        <td>Sub2</td>
        <td>100</td>
    </tr>


    <!-- Asif -->
    <tr>
        <td rowspan="2">Asif</td>

        <td>Sub1</td>
        <td>95</td>

        <td rowspan="2">193</td>
    </tr>

    <tr>
        <td>Sub2</td>
        <td>98</td>
    </tr>

</table>

</body>
</html>
