<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="" method ="get">
        <fieldset>
            <legend><b>REGISTRATION FORM</b></legend>
        <label for="U1">Username</label>
        <input type="text" id = "U1" name="uname" maxlength="30" placeholder="enter username" size="50" required autofocus>
    <br><br>
    <label for="P1">Password</label>
    <input type="password" id = "P1" name="pword" maxlength="30" placeholder="enter password" size="50" disabled>
<br><br>
    <label for="E1">Email</label>
    <input type="email" id = "E1" name="email" maxlength="30" placeholder="enter email" size="50" value="sunnyrajsingh@gmail.com" read only>
<br><br>

<label for="add1">enter Address</label><br>
<textarea name="address" id="add1" rows="10" cols="40">Jalandhar</textarea>
   <br><br>
   
<label for="h1">Hobbies:</label>
<input type="checkbox" name="hobby" id="cook1" value="cooking" checked>
<label for="cook1">cooking</label>
<input type="checkbox" name="hobby" id="sing1" value="singing">
<label for="sing1">singing</label>
<input type="checkbox" name="hobby" id="dance1" value="dancing">
<label for="dance1">dancing</label>
<br><br>
<label for="course">Select  course:</label>
<input type="radio" name="course" id="btech" value="btech" checked>
<label for="btech">B.Tech</label>   
<input type="radio" name="course" id="BCA" value="BCA">
<label for="BCA">BCA</label>  
<input type="radio" name="course" id="BSC" value="BSC">
<label for="BSC">BSC</label>


<br><br>         
<label for="state1">Select State:</label>
<select name="state1" id="state1" size="2" multiple>
    <option value="Punjab" selected>Punjab</option>
    <option value="Bihar">Bihar</option>
    <option value="Sikkim">Sikkim</option>
    <option value="Haryana">Haryana</option>
</select>
<br><br>
<label for="marks">Enter marks:</label>
<input type="number" name="marks" id="marks" min="0" max="20" step="20">

<br><br>
<label for="upload">upload file:</label>
<input type="file" id="upload" name="upload" accept="image/*">
<br><br>
<input type="date" name="date1" id="date1">
<input type="time" name="time1" id="time1">
<br><br>    
+++++++++++++++++++++++++++++++                                                                                                                              

<input type="submit" id="submit" name="submit" value="Submit form">
<input type="reset" id="reset" name="reset" value="reset">
<input type="button" value="Ok">
</fieldset>

</body>
</html>
